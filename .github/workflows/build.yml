name: Build GUI + TUI Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows GUI + TUI & Publish Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Resolve tag
        id: vars
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Setup libusb (USB backend import lib + runtime DLL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # vcpkg is preinstalled on windows-latest; install libusb so rusb can link it,
          # and so we can bundle the runtime DLL next to the binaries.
          & "C:\vcpkg\vcpkg.exe" install libusb:x64-windows
          $installed = "C:\vcpkg\installed\x64-windows"
          if (-not (Test-Path "$installed\bin\libusb-1.0.dll")) {
            throw "libusb-1.0.dll not found after vcpkg install"
          }
          # rusb's build script honors the LIBUSB env var (expects lib/ and include/).
          echo "LIBUSB=$installed" >> $env:GITHUB_ENV
          echo "LibUSB path: $installed"

      - name: Build penumbra-gui and antumbra (TUI)
        shell: bash
        run: cargo build --release -p penumbra-gui -p antumbra

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/penumbra-gui.exe staging/
          cp target/release/antumbra.exe staging/
          cp "C:/vcpkg/installed/x64-windows/bin/libusb-1.0.dll" staging/
          7z a "penumbra-${{ steps.vars.outputs.tag }}-windows-x86_64.zip" ./staging/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: penumbra-${{ steps.vars.outputs.tag }}-windows-x86_64
          path: penumbra-${{ steps.vars.outputs.tag }}-windows-x86_64.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Penumbra ${{ steps.vars.outputs.tag }}
          files: penumbra-${{ steps.vars.outputs.tag }}-windows-x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
